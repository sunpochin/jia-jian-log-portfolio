<!--
檔案用途：/demo 展示模式的照護事件示意圖，非任何真人照片；用來示範照護大事記的照片附件功能。
所在層：public/demo/care-timeline；純靜態資產，由 src/lib/demoData.ts 的種子時間軸以
demo_photo_urls 引用，展示模式以外的正式流程不會載入這個檔案。
主要關聯：src/lib/demoData.ts（getFallbackDemoCareTimeline）、
src/features/care-family/components/CareTimeline.tsx（渲染 demo_photo_urls）。
-->
<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="示意圖：小腿浮腫程度示意，非真實照片">
  <rect width="480" height="480" rx="24" fill="#fdf4e9"/>
  <text x="240" y="52" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#9a5b1f">示意圖・非真實照片</text>
  <!-- 小腿輪廓：刻意用抽象幾何形狀表示，不描繪真實人體特徵 -->
  <path d="M170 100 C170 100 155 220 165 300 C172 350 190 390 210 420 L270 420 C280 390 288 350 282 300 C276 220 270 100 270 100 Z" fill="#f6c9a0" stroke="#c9895a" stroke-width="4"/>
  <!-- 按壓凹陷處標記 -->
  <circle cx="220" cy="330" r="14" fill="#e8935a" opacity="0.85"/>
  <circle cx="220" cy="330" r="26" fill="none" stroke="#e8935a" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="240" y="450" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#7a4a1c">第 1 天：按壓後凹陷回彈慢</text>
</svg>
